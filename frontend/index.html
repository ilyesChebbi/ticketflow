<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TicketFlow - Cloud Native Ticketing</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #0f172a; color: #f8fafc; }
        .glass { background: rgba(30, 41, 59, 0.7); backdrop-filter: blur(10px); border: 1px solid rgba(255, 255, 255, 0.1); }
    </style>
</head>
<body class="min-h-screen">
    <!-- Navbar -->
    <nav class="glass sticky top-0 z-50 px-6 py-4 flex justify-between items-center">
        <div class="flex items-center gap-2">
            <div class="w-8 h-8 rounded-full bg-gradient-to-tr from-blue-500 to-purple-500 flex items-center justify-center font-bold text-white">T</div>
            <span class="text-xl font-bold tracking-tight">TicketFlow</span>
        </div>
        <div class="text-sm text-gray-400">Microservices Demo (REST + gRPC + SOAP)</div>
    </nav>

    <main class="max-w-6xl mx-auto px-6 py-12">
        <div class="grid grid-cols-1 lg:grid-cols-3 gap-8">
            
            <!-- Left Side: Event Catalog (REST) -->
            <div class="lg:col-span-2 space-y-6">
                <div class="flex justify-between items-end">
                    <div>
                        <h1 class="text-3xl font-bold mb-2">Live Events</h1>
                        <p class="text-gray-400">Data fetched from event-catalog-service</p>
                    </div>
                    <span class="bg-green-900/50 text-green-400 px-3 py-1 rounded-full text-xs font-semibold border border-green-800">REST API</span>
                </div>

                <div id="events-container" class="grid grid-cols-1 md:grid-cols-2 gap-6">
                    <!-- Skeleton Loader -->
                    <div class="animate-pulse glass rounded-xl p-4 h-48"></div>
                    <div class="animate-pulse glass rounded-xl p-4 h-48"></div>
                </div>
            </div>

            <!-- Right Side: Booking Form (Saga Orchestrator) -->
            <div class="lg:col-span-1">
                <div class="glass rounded-xl p-6 sticky top-24">
                    <h2 class="text-xl font-bold mb-1">Checkout</h2>
                    <p class="text-sm text-gray-400 mb-6" id="checkout-subtitle">Select an event to begin</p>

                    <form id="booking-form" class="space-y-4 opacity-50 pointer-events-none">
                        <div>
                            <label class="block text-sm font-medium text-gray-300 mb-1">Selected Event</label>
                            <input type="text" id="selectedEventName" class="w-full bg-slate-800 border border-slate-700 rounded-lg px-4 py-2 text-gray-400 cursor-not-allowed" value="None" readonly>
                        </div>
                        <div>
                            <label class="block text-sm font-medium text-gray-300 mb-1">Session ID</label>
                            <input type="text" id="sessionId" class="w-full bg-slate-800 border border-slate-700 rounded-lg px-4 py-2 text-white focus:outline-none focus:border-blue-500 transition" readonly>
                        </div>
                        
                        <div class="grid grid-cols-2 gap-4">
                            <div>
                                <label class="block text-sm font-medium text-gray-300 mb-1">Category</label>
                                <select id="category" class="w-full bg-slate-800 border border-slate-700 rounded-lg px-4 py-2 text-white focus:outline-none focus:border-blue-500 transition">
                                    <option value="VIP">VIP</option>
                                    <option value="STANDARD">Standard</option>
                                </select>
                            </div>
                            <div>
                                <label class="block text-sm font-medium text-gray-300 mb-1">Quantity</label>
                                <input type="number" id="quantity" value="1" min="1" max="10" class="w-full bg-slate-800 border border-slate-700 rounded-lg px-4 py-2 text-white focus:outline-none focus:border-blue-500 transition" required>
                            </div>
                        </div>

                        <button type="submit" id="submit-btn" class="w-full bg-blue-600 hover:bg-blue-500 text-white font-semibold py-3 rounded-lg transition-all duration-200 shadow-lg shadow-blue-900/50 flex justify-center items-center gap-2">
                            Confirm Order
                        </button>
                    </form>

                    <!-- Result Area -->
                    <div id="result" class="mt-6 hidden rounded-lg p-4 text-sm border"></div>
                </div>
            </div>
        </div>
    </main>

    <script>
        const GATEWAY_URL = 'http://localhost:8888';

        // 1. Fetch Events
        async function loadEvents() {
            const container = document.getElementById('events-container');
            try {
                const res = await fetch(`${GATEWAY_URL}/api/v1/events`);
                if (!res.ok) throw new Error('Failed to fetch');
                
                const events = await res.json();
                
                if (events.length === 0) {
                    container.innerHTML = `<div class="col-span-2 text-center text-gray-400 p-8 glass rounded-xl">No events found. Add some via POST /api/v1/events</div>`;
                    return;
                }

                container.innerHTML = events.map(event => `
                    <div onclick="selectEvent(${event.id}, '${event.name}')" class="glass rounded-xl p-5 hover:border-blue-500/50 transition duration-300 group cursor-pointer border border-slate-700">
                        <div class="flex justify-between items-start mb-4">
                            <h3 class="text-lg font-bold text-white group-hover:text-blue-400 transition">${event.name}</h3>
                            <span class="bg-slate-800 text-xs px-2 py-1 rounded">ID: ${event.id}</span>
                        </div>
                        <p class="text-sm text-gray-400 mb-4 line-clamp-2">${event.description}</p>
                        <div class="flex justify-between items-center text-sm">
                            <div class="text-gray-300">
                                <p>📍 ${event.venue}</p>
                                <p>📅 ${new Date(event.eventDate).toLocaleDateString()}</p>
                            </div>
                            <div class="text-blue-400 font-bold text-lg">
                                ${event.basePrice} TND
                            </div>
                        </div>
                    </div>
                `).join('');

            } catch (error) {
                container.innerHTML = `<div class="col-span-2 text-center text-red-400 p-8 glass rounded-xl border-red-900">Failed to connect to API Gateway. Is Docker running?</div>`;
            }
        }

        // 2. Handle Event Selection
        function selectEvent(eventId, eventName) {
            const form = document.getElementById('booking-form');
            const subtitle = document.getElementById('checkout-subtitle');
            
            // Unlock the form
            form.classList.remove('opacity-50', 'pointer-events-none');
            subtitle.innerText = "Orchestrated via booking-service";

            // Fill the form with the selected Event's data
            document.getElementById('selectedEventName').value = eventName;
            
            // MOCK LOGIC: Map Event ID to a Session ID
            // In a real app, this would be a dropdown of sessions fetched from the backend
            let sessionId = "";
            if (eventId === 1) sessionId = "session-123"; // Coldplay
            else if (eventId === 3) sessionId = "session-456"; // Dune
            else sessionId = "session-789"; // Default for others

            document.getElementById('sessionId').value = sessionId;

            // Clear previous result
            document.getElementById('result').classList.add('hidden');
        }

        // 3. Submit Booking (Saga)
        document.getElementById('booking-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const btn = document.getElementById('submit-btn');
            const resultDiv = document.getElementById('result');
            
            btn.disabled = true;
            btn.innerHTML = `Processing...`;
            
            resultDiv.className = 'mt-6 rounded-lg p-4 text-sm border bg-slate-800 border-slate-700 text-gray-300';
            resultDiv.classList.remove('hidden');
            resultDiv.innerHTML = 'Orchestrating gRPC and SOAP calls...';

            const payload = {
                sessionId: document.getElementById('sessionId').value,
                category: document.getElementById('category').value,
                quantity: parseInt(document.getElementById('quantity').value)
            };

            try {
                const res = await fetch(`${GATEWAY_URL}/api/v1/orders`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Idempotency-Key': 'web-' + crypto.randomUUID() 
                    },
                    body: JSON.stringify(payload)
                });

                const data = await res.json();

                if (res.ok) {
                    resultDiv.className = 'mt-6 rounded-lg p-4 text-sm border bg-green-900/30 border-green-800 text-green-300';
                    resultDiv.innerHTML = `
                        <div class="font-bold mb-2">Order Confirmed!</div>
                        <p><strong>Order ID:</strong> ${data.orderId}</p>
                        <p><strong>Status:</strong> ${data.status}</p>
                        <p><strong>Transaction:</strong> ${data.transactionId}</p>
                        <p><strong>Total:</strong> ${data.totalPrice} TND</p>
                    `;
                } else {
                    throw new Error(data.detail || data.message || 'Order failed');
                }
            } catch (err) {
                resultDiv.className = 'mt-6 rounded-lg p-4 text-sm border bg-red-900/30 border-red-800 text-red-300';
                resultDiv.innerHTML = `<strong>Error:</strong> ${err.message}`;
            } finally {
                btn.disabled = false;
                btn.innerHTML = 'Confirm Order';
            }
        });

        loadEvents();
    </script>
</body>
</html>
