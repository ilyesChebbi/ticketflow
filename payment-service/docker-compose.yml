# Minimal compose: only payment-service for now. Teammates add their own services here.
networks:
  ticketflow-net:
    driver: bridge

services:
  payment:
    build: ./payment-service
    environment:
      SERVER_PORT: 8085
    ports: ["8085:8085"]
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8085/actuator/health | grep -q UP"]
      interval: 15s
      timeout: 3s
      retries: 10
    networks: [ticketflow-net]
