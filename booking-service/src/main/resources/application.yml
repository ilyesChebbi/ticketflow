server:
  port: ${SERVER_PORT:8082}

spring:
  application:
    name: booking-service
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5433/bookingdb}
    username: ${DB_USER:ticketflow}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: always

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

# Resilience4j Configuration
resilience4j:
  circuitbreaker:
    instances:
      inventoryService:
        slidingWindowSize: 10
        failureRateThreshold: 50
        waitDurationInOpenState: 10s
        ignoreExceptions:
          - com.ticketflow.bookingservice.exception.InsufficientSeatsException
      paymentService:
        slidingWindowSize: 10
        failureRateThreshold: 50
        waitDurationInOpenState: 10s
        ignoreExceptions:
          - com.ticketflow.bookingservice.exception.PaymentRefusedException
          - com.ticketflow.bookingservice.exception.BookingException
      pricingService:
        slidingWindowSize: 10
        failureRateThreshold: 50
        waitDurationInOpenState: 10s
  retry:
    instances:
      inventoryService:
        maxAttempts: 2
        waitDuration: 200ms

# Adresses des services appelés (valeurs par défaut = lancement en local, sans Docker)
grpc:
  seat-inventory:
    host: ${SEAT_INVENTORY_HOST:localhost}
    port: ${SEAT_INVENTORY_PORT:9090}
  pricing:
    host: ${PRICING_HOST:localhost}
    port: ${PRICING_PORT:9091}

payment:
  soap:
    url: ${PAYMENT_SOAP_URL:http://localhost:8085/ws}
